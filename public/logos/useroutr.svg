<!-- Primary mark. The left arm
     reads as two orange nodes descending into a 6-unit stub.
     color= sets a default for currentColor when opened standalone.
     Any CSS color rule overrides it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     color="#14161A" role="img" aria-label="Useroutr">
  <title>Useroutr</title>
  <rect width="64" height="64" fill="#ffffff"/>
  <circle cx="20" cy="14" r="3" fill="#F4671F"/>
  <circle cx="20" cy="23" r="3" fill="#F4671F"/>
  <path d="M20 32 L20 38 A12 12 0 0 0 44 38 L44 14"
        fill="none"
        stroke="currentColor"
        stroke-width="6"
        stroke-linecap="round"/>
</svg>
